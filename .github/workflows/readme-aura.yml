name: Generate README

on:
  push:
    branches: [main]
    paths:
      - 'readme.source.md'
      - '.github/workflows/readme-aura.yml'
      - 'scripts/**'
      - 'assets/**'
  schedule:
    - cron: '0 6 * * *' # Updates stats every day at 6:00 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch Real GitHub Stats
        env:
          GITHUB_TOKEN: ${{ secrets.AURA_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/fetch_stats.js

      - name: Stage source markdown
        run: git add readme.source.md

      - name: Generate README
        uses: collectioneur/readme-aura@main
        with:
          source: readme.source.md
          output: README.md
          assets_dir: .github/assets
          github_token: ${{ secrets.GITHUB_TOKEN }}
          auto_commit: 'true'
          commit_message: 'generate README via readme-aura'

      - name: Ensure all changes pushed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add readme.source.md README.md .github/assets
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync readme.source.md and assets"
            git push
          fi
